version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kisan_pehele_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kisan_user
      POSTGRES_PASSWORD: kisan_secure_pass
      POSTGRES_DB: kisan_pehele_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisan_user -d kisan_pehele_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kisan_pehele_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: kisan_pehele_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://kisan_user:kisan_secure_pass@postgres:5432/kisan_pehele_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "kisan_pehele_jwt_super_secret_key_sih26032_2026"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: kisan_pehele_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
